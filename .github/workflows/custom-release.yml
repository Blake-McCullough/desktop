name: Release (custom build)

# Builds the Windows, Linux and Arch Linux packages for a release published
# by hand on GitHub (create one with a new tag such as v3.6.11-custom2), or
# for an existing tag when run from the Actions tab, and attaches them.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v3.6.11-custom1)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: custom-release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    # Releases published by the auto-release workflow use GITHUB_TOKEN, which
    # doesn't trigger this workflow, so this only runs for manual releases.
    uses: ./.github/workflows/build-installers.yml
    with:
      ref: refs/tags/${{ inputs.tag || github.event.release.tag_name }}

  upload:
    name: Attach to release
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: release
          merge-multiple: true

      - name: Upload
        run: |
          ls -la release
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag \
              --title "GitHub Desktop Custom $TAG" \
              --notes "Windows: run GitHubDesktopCustomSetup-x64.exe (unsigned: choose More info, then Run anyway). Arch/CachyOS: sudo pacman -U the .pkg.tar.zst. Other Linux: the AppImage or .tar.gz. See the README for what's included."
          fi
          gh release upload "$TAG" release/* --clobber
