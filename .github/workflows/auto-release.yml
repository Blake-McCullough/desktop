name: Auto release (main)

# Every push to main builds the Windows installer, the Linux AppImage and
# tarball, and an Arch Linux package, and publishes them as a new GitHub
# release, versioned "<app/package.json version>-b<run number>"
# (e.g. 3.6.11-custom1-b00042) and tagged "v<version>".
#
# If several commits land close together, only the newest is built.

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-release-main
  cancel-in-progress: true

jobs:
  prepare:
    name: Work out version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      base: ${{ steps.version.outputs.base }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          base=$(node -p "require('./app/package.json').version")
          # Zero-padded so versions also sort correctly as text.
          version="$base-b$(printf '%05d' "$GITHUB_RUN_NUMBER")"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

  build:
    name: Build
    needs: prepare
    uses: ./.github/workflows/build-installers.yml
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.prepare.outputs.version }}

  publish:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # History (without file contents) for the changelog.
          fetch-depth: 0
          filter: blob:none

      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: release
          merge-multiple: true

      - name: Write release notes
        run: |
          ls -la release
          # Commits since the previous release on main (first-parent, so a
          # merge from upstream shows as one line rather than hundreds).
          if previous=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null); then
            range="$previous..HEAD"; heading="Changes since $previous"
          else
            range="-20"; heading="Recent changes"
          fi
          {
            echo "Built automatically from $GITHUB_SHA on main."
            echo
            echo "### Install"
            echo
            echo "- **Windows:** run \`GitHubDesktopCustomSetup-x64.exe\`. It isn't code-signed, so SmartScreen will warn you: choose **More info → Run anyway**."
            echo "- **Arch Linux / CachyOS / Manjaro:** download the \`.pkg.tar.zst\` and run \`sudo pacman -U github-desktop-custom-bin-*.pkg.tar.zst\`."
            echo "- **Other Linux:** download the \`.AppImage\`, \`chmod +x\` it and run it — or extract the \`.tar.gz\` and run \`github-desktop-custom/github-desktop-custom\`."
            echo
            echo "Your settings and repositories are kept when upgrading."
            echo
            echo "### $heading"
            echo
            git log --first-parent --format='- %s (%h)' $range
          } > release-notes.md
          cat release-notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          TITLE:
            GitHub Desktop Custom ${{ needs.prepare.outputs.base }} (build ${{
            github.run_number }})
        run: |
          gh release create "$TAG" release/* \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file release-notes.md \
            --latest
